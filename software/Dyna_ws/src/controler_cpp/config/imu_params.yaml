/interface:
  ros__parameters:
    # IMU calibration offsets, subtracted from the raw sensor reading in imu_cb()
    # before axis remapping / normalization.

    # Accelerometer bias (g), raw sensor frame (x, y, z)
    accel_offset_x: 0.0 #-0.0082099141
    accel_offset_y: 0.0 #-0.0017630484 #0.9982369516 - 1
    accel_offset_z: 0.0 #-0.0181648322

    # Gyroscope bias (deg/s), raw sensor frame (x, y, z)
    gyro_offset_x: 2.199104913
    gyro_offset_y: -0.7855885956
    gyro_offset_z: 0.4468341824
